<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{% block title %}CropAI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<!-- ── NAV ─────────────────────────────────────────────────────────── -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <div class="logo-icon"><i class="fas fa-leaf"></i></div>
      <span>CropAI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="{% if request.path=='/' %}active{% endif %}">Home</a></li>
      <li><a href="/predict" class="{% if '/predict' in request.path %}active{% endif %}">Predict</a></li>
      <li><a href="/recommend" class="{% if '/recommend' in request.path %}active{% endif %}">Recommend</a></li>
      <li><a href="/compare" class="{% if '/compare' in request.path %}active{% endif %}">Compare</a></li>
      <li><a href="/forecast" class="{% if '/forecast' in request.path %}active{% endif %}">Forecast</a></li>
      <li><a href="/dashboard" class="{% if '/dashboard' in request.path %}active{% endif %}">Dashboard</a></li>
    </ul>
    <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
  </div>
</nav>

<!-- ── PAGE CONTENT ───────────────────────────────────────────────── -->
<main>{% block content %}{% endblock %}</main>

<!-- ── FOOTER ────────────────────────────────────────────────────── -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-logo">
      <div class="logo-icon sm"><i class="fas fa-leaf"></i></div>
      <span>CropAI</span>
    </div>
    <p>Climate Change Impact Analyzer on Crop Production — Powered by ML models</p>
    <p class="footer-copy">© 2026</p>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
